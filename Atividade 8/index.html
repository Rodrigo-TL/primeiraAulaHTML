<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes funções</title>
</head>
<body>
    <main>
        <h1>Teste de funções matemáticas</h1>
        <h2>Operações</h2>
        <label for="primeiro-numero">Digite o primeiro numero:</label>
        <input type="number" id="primeiro-numero">
        <br>
        <label for="segundo-numero">Digite o segundo numero:</label>
        <input type="number" id="segundo-numero">
        <br>
        <button type="button" onclick="soma()">SOMA</button>
        <button type="button" onclick="subtracao()">SUBTRAÇÃO</button>
        <button type="button" onclick="multiplicacao()">MULTIPLICAÇÃO</button>
        <button type="button" onclick="divisao()">DIVISÃO</button>
        <br>
        <p>Seu resultado é: <strong id="resultado"></strong></p>
        <br>
        <br>
        <button type="button" onclick="apagarLocalStorage()">Apagar histórico</button>
        <button type="button" onclick="exibirHistorico()">exibir historico</button>
        <button type="button" onclick="valorProduto()">Valor do Produto</button>
        <br>
        <p>Histórico: <strong id="exibir-historico"></strong></p>
        <p>O valor do produto é: <strong id="valor-produto"></strong></p>
        
        <br>
        
        <script>
            function valorProduto() {
                const valor = prompt('Digite o valor do produto:');
                if (valor !== null) {
                    document.getElementById('valor-produto').textContent = valor;
                }
            }

            function exibirHistorico() {
                const historico = localStorage.getItem('historico') || '';
                document.getElementById('exibir-historico').textContent = historico;
            }
        </script>
        <script src="./js/funcoes.js"></script>
    </main>
</body>
</html>
